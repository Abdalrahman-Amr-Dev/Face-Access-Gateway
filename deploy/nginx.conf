# Ubuntu: install as /etc/nginx/sites-available/face-access-gateway
# Replace api.example.com with your domain or EC2 public IP before enabling.
# This file is included inside Nginx's http context by sites-enabled.
map $http_upgrade $face_access_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name api.example.com;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $face_access_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
